<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>Andbrawl — AndKit</title>
  <meta name="description" content="Официальный портал Andbrawl и библиотека ресурсов AndKit">
  <meta property="og:title" content="Andbrawl — AndKit">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#07080c">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Unbounded:wght@700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #07080c;
      --bg-mesh-1: rgba(0, 210, 255, 0.07);
      --bg-mesh-2: rgba(120, 0, 255, 0.07);
      --bg-card: rgba(22, 25, 38, 0.65);
      --bg-card-hover: rgba(32, 36, 56, 0.85);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(0, 210, 255, 0.3);
      --text-primary: #f5f7fc;
      --text-secondary: #8e96b7;
      --btn-download-bg: linear-gradient(135deg, #00d2ff 0%, #0066ff 100%);
      --btn-download-shadow: 0 8px 25px rgba(0, 136, 255, 0.4);
      --accent-yellow: #ffc800;
      --accent-cyan: #00f0ff;
      --accent-green: #00e676;
      --header-bg: rgba(7, 8, 12, 0.7);
      --modal-bg: rgba(3, 4, 7, 0.85);
      --card-radius: 20px;
      --transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    [data-theme="light"] {
      --bg-main: #f0f3fa;
      --bg-mesh-1: rgba(0, 102, 255, 0.05);
      --bg-mesh-2: rgba(180, 0, 255, 0.04);
      --bg-card: rgba(255, 255, 255, 0.8);
      --bg-card-hover: rgba(255, 255, 255, 0.95);
      --border-color: rgba(0, 0, 0, 0.08);
      --border-glow: rgba(0, 102, 255, 0.25);
      --text-primary: #0f121d;
      --text-secondary: #5e6687;
      --btn-download-bg: linear-gradient(135deg, #0066ff 0%, #0044cc 100%);
      --btn-download-shadow: 0 8px 25px rgba(0, 102, 255, 0.3);
      --accent-yellow: #e69d00;
      --accent-cyan: #0088ff;
      --header-bg: rgba(240, 243, 250, 0.75);
      --modal-bg: rgba(240, 243, 250, 0.85);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-main);
      background-image: radial-gradient(circle at 15% 15%, var(--bg-mesh-1) 0%, transparent 45%), radial-gradient(circle at 85% 60%, var(--bg-mesh-2) 0%, transparent 50%);
      background-attachment: fixed;
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color var(--transition), color var(--transition);
      overflow-x: hidden;
      padding-bottom: 50px;
    }

    .wrapper { width: 100%; max-width: 680px; padding: 0 20px; }

    header {
      position: sticky; top: 12px; z-index: 90; width: calc(100% - 24px); max-width: 680px;
      background: var(--header-bg); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border-color); border-radius: 24px; margin-top: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12); transition: background var(--transition), border-color var(--transition);
    }

    .header-inner { width: 100%; padding: 10px 18px; display: flex; justify-content: space-between; align-items: center; }

    .brand-logo {
      font-family: 'Unbounded', sans-serif; font-size: 1.25rem; font-weight: 800; letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--text-primary) 30%, var(--accent-cyan));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; text-decoration: none; cursor: pointer;
    }

    .top-controls { display: flex; gap: 8px; position: relative; }

    .control-btn {
      background: var(--bg-card); border: 1px solid var(--border-color); width: 44px; height: 44px; border-radius: 14px;
      cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--text-primary);
      backdrop-filter: blur(10px); transition: all var(--transition);
    }

    .control-btn:hover { background: var(--bg-card-hover); border-color: var(--border-glow); transform: translateY(-2px); }
    .control-btn:active { transform: scale(0.94) translateY(0); }
    .control-btn svg { width: 20px; height: 20px; fill: currentColor; }

    .dropdown-menu {
      position: absolute; top: 56px; right: 0; background: var(--bg-card);
      backdrop-filter: blur(24px) saturate(200%); -webkit-backdrop-filter: blur(24px) saturate(200%);
      border: 1px solid var(--border-color); border-radius: 20px; padding: 10px; width: 260px;
      display: flex; flex-direction: column; gap: 6px; z-index: 100; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      opacity: 0; visibility: hidden; transform: translateY(-12px) scale(0.95); transition: all var(--transition);
    }

    .dropdown-menu.active { opacity: 1; visibility: visible; transform: translateY(0) scale(1); }

    .menu-item {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 14px;
      text-decoration: none; color: var(--text-primary); font-size: 0.88rem; font-weight: 700; cursor: pointer; transition: all var(--transition);
    }

    .menu-item:hover { background: var(--bg-card-hover); transform: translateX(4px); }
    .menu-item img, .menu-item span.icon { width: 26px; height: 26px; border-radius: 8px; object-fit: cover; display: flex; align-items: center; justify-content: center; }

    .page { display: none; width: 100%; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    .page.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    .hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 36px 0 20px; position: relative; }
    .app-icon { width: 112px; height: 112px; border-radius: 28px; margin-bottom: 18px; object-fit: cover; border: 1px solid var(--border-color); box-shadow: 0 16px 36px rgba(0, 0, 0, 0.3); transition: transform var(--transition); }
    .app-icon:hover { transform: scale(1.05) rotate(2deg); }

    .title { font-family: 'Unbounded', sans-serif; font-size: clamp(2.2rem, 7vw, 3.2rem); font-weight: 900; letter-spacing: -1px; line-height: 1.1; background: linear-gradient(180deg, var(--text-primary) 0%, var(--text-secondary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; }
    .subtitle { color: var(--text-secondary); font-size: clamp(0.8rem, 2.8vw, 0.92rem); font-weight: 600; margin-top: 8px; margin-bottom: 24px; letter-spacing: 0.2px; }

    .download-btn {
      display: flex; align-items: center; justify-content: center; width: 100%; padding: 18px 28px; border-radius: 20px;
      background: var(--btn-download-bg); box-shadow: var(--btn-download-shadow); color: #ffffff;
      font-family: 'Unbounded', sans-serif; font-size: 1.1rem; font-weight: 800; letter-spacing: 0.5px;
      text-decoration: none; text-transform: uppercase; transition: all var(--transition); position: relative; overflow: hidden;
    }
    .download-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 35px rgba(0, 136, 255, 0.5); }
    .download-btn:active { transform: translateY(1px); }

    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; width: 100%; }
    .stat-card { background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 18px; padding: 14px 10px; text-align: center; transition: all var(--transition); }
    .stat-card:hover { border-color: var(--border-glow); transform: translateY(-2px); }
    .stat-val { font-family: 'Unbounded', sans-serif; font-size: 1.15rem; font-weight: 800; color: var(--accent-cyan); }
    .stat-lbl { font-size: 0.68rem; color: var(--text-secondary); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }

    .search-box { margin-top: 24px; width: 100%; position: relative; }
    .search-input { width: 100%; padding: 16px 18px 16px 48px; background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 18px; color: var(--text-primary); font-size: 0.9rem; font-weight: 600; outline: none; transition: all var(--transition); }
    .search-input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 20px rgba(0, 240, 255, 0.15); background: var(--bg-card-hover); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 22px; height: 22px; fill: var(--text-secondary); pointer-events: none; transition: fill var(--transition); }
    .search-input:focus + .search-icon { fill: var(--accent-cyan); }

    .section-header { font-size: 0.8rem; font-weight: 800; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1.5px; margin: 28px 0 14px; display: flex; justify-content: space-between; align-items: center; }

    .quick-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }
    .quick-btn { background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text-primary); font-size: 0.88rem; font-weight: 700; transition: all var(--transition); }
    .quick-btn:hover { background: var(--bg-card-hover); border-color: var(--border-glow); transform: translateY(-2px); }

    .screenshots-slider { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 12px; margin: 0 -20px; padding-left: 20px; padding-right: 20px; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
    .screenshots-slider::-webkit-scrollbar { display: none; }
    .screenshot-img { width: min(170px, 46vw); aspect-ratio: 9 / 16; object-fit: cover; border-radius: 20px; border: 1px solid var(--border-color); flex-shrink: 0; cursor: pointer; scroll-snap-align: start; transition: all var(--transition); background: var(--bg-card); box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2); }
    .screenshot-img:hover { transform: translateY(-4px) scale(1.02); border-color: var(--border-glow); }

    .creators-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
    .creator-card { background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 20px; padding: 14px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: var(--text-primary); transition: all var(--transition); }
    .creator-card:hover { background: var(--bg-card-hover); border-color: var(--border-glow); transform: translateY(-2px); }
    .creator-avatar { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-cyan); flex-shrink: 0; }
    .creator-info { overflow: hidden; }
    .creator-name { font-size: 0.88rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .creator-tag { font-size: 0.75rem; color: var(--accent-cyan); font-weight: 700; margin-top: 2px; }

    .hub-list { display: flex; flex-direction: column; gap: 12px; }
    .card { background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: var(--card-radius); padding: 18px; display: flex; align-items: center; gap: 16px; transition: all var(--transition); }
    .card:hover { background: var(--bg-card-hover); border-color: var(--border-glow); transform: translateY(-2px); }
    .card-icon { width: 52px; height: 52px; border-radius: 16px; object-fit: cover; flex-shrink: 0; box-shadow: 0 8px 16px rgba(0,0,0,0.15); }
    .card-content { flex-grow: 1; min-width: 0; }
    .card-title { font-size: 1rem; font-weight: 800; margin-bottom: 4px; }
    .card-desc { font-size: 0.82rem; color: var(--text-secondary); line-height: 1.4; margin-bottom: 12px; }
    .card-btn { display: inline-flex; align-items: center; padding: 8px 16px; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-primary); font-size: 0.8rem; font-weight: 700; text-decoration: none; cursor: pointer; transition: all var(--transition); }
    .card-btn:hover { background: var(--accent-cyan); color: #000000; border-color: var(--accent-cyan); }

    .empty-state { width: 100%; text-align: center; padding: 24px; background: var(--bg-card); border: 1px dashed var(--border-color); border-radius: var(--card-radius); color: var(--text-secondary); font-weight: 700; font-size: 0.88rem; }

    .andkit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; margin-top: 16px; }
    .resource-card { background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; transition: all var(--transition); }
    .resource-card:hover { background: var(--bg-card-hover); border-color: var(--border-glow); transform: translateY(-3px); }
    .resource-preview { width: 100%; height: 115px; border-radius: 14px; object-fit: contain; background: rgba(0, 0, 0, 0.2); display: flex; align-items: center; justify-content: center; margin-bottom: 12px; cursor: pointer; overflow: hidden; position: relative; }
    .resource-preview img, .resource-preview video { max-width: 100%; max-height: 100%; object-fit: contain; opacity: 0; transition: opacity 0.3s ease-in-out, transform 0.3s ease; }
    .resource-preview img.loaded, .resource-preview video.loaded { opacity: 1; }
    .resource-card:hover .resource-preview img, .resource-card:hover .resource-preview video { transform: scale(1.05); }
    .folder-badge { position: absolute; top: 6px; left: 6px; background: rgba(7, 8, 12, 0.75); backdrop-filter: blur(8px); border: 1px solid var(--border-color); border-radius: 8px; padding: 3px 8px; font-size: 0.65rem; color: var(--accent-cyan); font-weight: 800; z-index: 2; }
    .resource-name { font-size: 0.85rem; font-weight: 800; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .resource-meta { font-size: 0.72rem; color: var(--text-secondary); font-weight: 700; margin-top: 4px; margin-bottom: 12px; }
    .resource-actions { display: flex; gap: 8px; width: 100%; }
    .res-btn { flex: 1; padding: 9px 0; border-radius: 12px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-color); color: var(--text-primary); font-size: 0.78rem; font-weight: 800; text-decoration: none; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all var(--transition); }
    .res-btn:hover { background: var(--text-primary); color: #000000; border-color: var(--text-primary); }

    .audio-player-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .audio-play-btn { width: 52px; height: 52px; border-radius: 50%; background: var(--btn-download-bg); box-shadow: 0 6px 16px rgba(0, 136, 255, 0.3); border: none; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all var(--transition); }
    .audio-play-btn:hover { transform: scale(1.08); }
    .audio-play-btn svg { width: 24px; height: 24px; fill: currentColor; }

    .filter-tags { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-top: 12px; }
    .filter-tags::-webkit-scrollbar { display: none; }
    .tag-btn { padding: 8px 16px; border-radius: 30px; background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color); color: var(--text-secondary); font-size: 0.78rem; font-weight: 800; cursor: pointer; white-space: nowrap; transition: all var(--transition); }
    .tag-btn:hover { border-color: var(--border-glow); color: var(--text-primary); }
    .tag-btn.active { background: var(--accent-cyan); color: #000000; border-color: var(--accent-cyan); box-shadow: 0 0 16px rgba(0, 240, 255, 0.3); }

    .modal { position: fixed; inset: 0; background: var(--modal-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); z-index: 1000; display: flex; justify-content: center; align-items: center; padding: 24px; opacity: 0; visibility: hidden; transition: all var(--transition); }
    .modal.active { opacity: 1; visibility: visible; }
    .modal-img, .modal-video { max-width: 100%; max-height: 85vh; border-radius: 24px; object-fit: contain; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); display: none; border: 1px solid var(--border-color); }
    .modal-img.active, .modal-video.active { display: block; }
    .modal-close { position: absolute; top: 24px; right: 24px; background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-primary); width: 44px; height: 44px; border-radius: 50%; font-size: 1.4rem; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 1010; transition: all var(--transition); }
    .modal-close:hover { transform: scale(1.1); border-color: var(--border-glow); }

    .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--bg-card); backdrop-filter: blur(20px); border: 1px solid var(--border-glow); color: var(--text-primary); padding: 14px 28px; border-radius: 40px; font-size: 0.88rem; font-weight: 700; box-shadow: 0 16px 40px rgba(0,0,0,0.4); z-index: 2000; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); pointer-events: none; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    .scroll-top-btn { position: fixed; bottom: 24px; right: 24px; width: 48px; height: 48px; border-radius: 50%; background: var(--bg-card); backdrop-filter: blur(12px); border: 1px solid var(--border-color); color: var(--text-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; opacity: 0; visibility: hidden; transition: all var(--transition); z-index: 80; box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
    .scroll-top-btn:hover { transform: translateY(-4px); border-color: var(--border-glow); }
    .scroll-top-btn.visible { opacity: 1; visibility: visible; }

    @media (max-width: 400px) {
      .wrapper { padding: 0 14px; }
      .screenshots-slider { margin: 0 -14px; padding: 0 14px 12px; }
      .quick-grid { grid-template-columns: 1fr; }
      .andkit-grid { grid-template-columns: repeat(auto-fill, minmax(135px, 1fr)); }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="brand-logo" id="brand-logo" onclick="switchPage('main')">Andbrawl</div>
      <div class="top-controls">
        <button class="control-btn" onclick="sharePortal()" aria-label="Поделиться">
          <svg viewBox="0 0 24 24">
            <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/>
          </svg>
        </button>
        <button class="control-btn" onclick="toggleTheme()" aria-label="Тема">
          <svg id="theme-icon" viewBox="0 0 24 24">
            <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/>
          </svg>
        </button>
        <button class="control-btn" onclick="toggleMenu()" aria-label="Меню">
          <svg viewBox="0 0 24 24">
            <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
          </svg>
        </button>
        <div class="dropdown-menu" id="dropdown"></div>
      </div>
    </div>
  </header>

  <div class="wrapper">
    <div id="page-main" class="page active">
      <section class="hero">
        <img id="app-icon" class="app-icon" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'%3E%3C/svg%3E" alt="App Icon">
        <h1 id="app-title" class="title">Andbrawl</h1>
        <p id="app-subtitle" class="subtitle"></p>
        <a id="download-btn" class="download-btn" href="#">Скачать</a>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-val">v1.0</div>
            <div class="stat-lbl">Версия</div>
          </div>
          <div class="stat-card">
            <div class="stat-val">Online</div>
            <div class="stat-lbl">Сервер</div>
          </div>
          <div class="stat-card">
            <div class="stat-val">Free</div>
            <div class="stat-lbl">Доступ</div>
          </div>
        </div>
      </section>

      <div class="search-box">
        <input type="text" id="search-input" class="search-input" placeholder="Поиск по разделам..." oninput="filterHub()">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </div>

      <div class="section-header">Быстрые ссылки</div>
      <div class="quick-grid" id="quick-links-container"></div>

      <div class="section-header">Скриншоты</div>
      <div class="screenshots-slider" id="screenshots-container"></div>

      <div class="section-header" id="creators-section">Креаторы</div>
      <div class="creators-grid" id="creators-container"></div>

      <div class="section-header">Разделы портала</div>
      <div class="hub-list" id="hub-container"></div>
    </div>

    <div id="page-andkit" class="page">
      <section class="hero" style="padding: 24px 0 12px;">
        <h1 class="title">AndKit</h1>
        <p class="subtitle">Игровые ресурсы & Файлы</p>
      </section>

      <div class="search-box">
        <input type="text" id="andkit-search" class="search-input" placeholder="Поиск ресурсов..." oninput="filterAndKit()">
        <svg class="search-icon" viewBox="0 0 24 24">
          <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>
      </div>

      <div class="filter-tags">
        <button class="tag-btn active" onclick="setAndKitFilter('all', this)">Все</button>
        <button class="tag-btn" onclick="setAndKitFilter('image', this)">Картинки</button>
        <button class="tag-btn" onclick="setAndKitFilter('video', this)">Видео</button>
        <button class="tag-btn" onclick="setAndKitFilter('audio', this)">Звуки</button>
      </div>

      <div class="section-header">
        <span>Ресурсы</span>
        <span id="res-count-badge" style="font-size: 0.75rem; color: var(--accent-cyan);">0 файлов</span>
      </div>

      <div class="andkit-grid" id="andkit-container"></div>
    </div>
  </div>

  <div class="modal" id="modal" onclick="closeModal()">
    <button class="modal-close" aria-label="Закрыть" onclick="closeModal()">×</button>
    <img class="modal-img" id="modal-img" src="" alt="Preview">
    <video class="modal-video" id="modal-video" controls playsinline></video>
  </div>

  <button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()" aria-label="Наверх">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
      <path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/>
    </svg>
  </button>

  <div class="toast" id="toast"></div>

  <script>
    const moonPath = "M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z";
    const sunPath = "M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z";
    
    let globalHubItems = [];
    let andkitResources = [];
    let currentAndkitFilter = 'all';
    let activeAudio = null;
    let loadedResourcePaths = [];
    let searchTimeout = null;

    function initTheme() {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelector('#theme-icon path').setAttribute('d', theme === 'light' ? sunPath : moonPath);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const target = current === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', target);
      localStorage.setItem('theme', target);
      document.querySelector('#theme-icon path').setAttribute('d', target === 'light' ? sunPath : moonPath);
    }

    function toggleMenu() {
      document.getElementById('dropdown').classList.toggle('active');
    }

    function switchPage(pageId) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      const target = document.getElementById(`page-${pageId}`);
      if (target) {
        target.classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
      document.getElementById('dropdown').classList.remove('active');
      if (pageId === 'andkit' && andkitResources.length === 0) {
        parseAndKitResources();
      }
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function sharePortal() {
      if (navigator.share) {
        navigator.share({ title: document.title, url: window.location.href }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        showToast('Ссылка скопирована!');
      }
    }

    document.addEventListener('click', (e) => {
      const dropdown = document.getElementById('dropdown');
      const isMenuBtn = e.target.closest('.control-btn') && e.target.closest('.control-btn').getAttribute('onclick') === 'toggleMenu()';
      if (dropdown.classList.contains('active') && !dropdown.contains(e.target) && !isMenuBtn) {
        dropdown.classList.remove('active');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    window.addEventListener('scroll', () => {
      const btn = document.getElementById('scroll-top-btn');
      if (window.scrollY > 300) {
        btn.classList.add('visible');
      } else {
        btn.classList.remove('visible');
      }
    }, { passive: true });

    function scrollToTop() {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function openModal(src, type = 'image') {
      const modalImg = document.getElementById('modal-img');
      const modalVideo = document.getElementById('modal-video');
      modalImg.classList.remove('active');
      modalVideo.classList.remove('active');
      modalVideo.pause();

      if (type === 'video') {
        modalVideo.src = src;
        modalVideo.classList.add('active');
        modalVideo.play();
      } else {
        modalImg.src = src;
        modalImg.classList.add('active');
      }
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      const modalVideo = document.getElementById('modal-video');
      modalVideo.pause();
      modalVideo.src = '';
      document.getElementById('modal').classList.remove('active');
    }

    function filterHub() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const query = document.getElementById('search-input').value.toLowerCase();
        const hubContainer = document.getElementById('hub-container');

        const filtered = globalHubItems.filter(item => 
          item.title.toLowerCase().includes(query) || 
          (item.description && item.description.toLowerCase().includes(query))
        );

        if (filtered.length > 0) {
          const fragment = document.createDocumentFragment();
          filtered.forEach(item => fragment.appendChild(createCard(item)));
          hubContainer.replaceChildren(fragment);
        } else {
          hubContainer.innerHTML = `<div class="empty-state">Ничего не найдено</div>`;
        }
      }, 100);
    }

    function createCard(item) {
      const card = document.createElement('div');
      card.className = 'card';
      const isInternal = item.link && item.link.startsWith('#page-');
      const isAnchor = item.link && item.link.startsWith('#') && !isInternal;

      const cardContent = document.createElement('div');
      cardContent.className = 'card-content';

      const title = document.createElement('div');
      title.className = 'card-title';
      title.innerText = item.title;

      const desc = document.createElement('div');
      desc.className = 'card-desc';
      desc.innerText = item.description || '';

      const btn = document.createElement('a');
      btn.className = 'card-btn';
      btn.innerText = item.button_text;

      if (isInternal) {
        const pageId = item.link.replace('#page-', '');
        btn.href = '#';
        btn.onclick = (e) => {
          e.preventDefault();
          switchPage(pageId);
        };
      } else {
        btn.href = item.link;
        if (!isAnchor) {
          btn.target = '_blank';
          btn.rel = 'noopener noreferrer';
        }
      }

      cardContent.appendChild(title);
      cardContent.appendChild(desc);
      cardContent.appendChild(btn);

      const iconImg = document.createElement('img');
      iconImg.className = 'card-icon';
      iconImg.src = item.icon;
      iconImg.alt = '';
      iconImg.loading = 'lazy';

      card.appendChild(iconImg);
      card.appendChild(cardContent);

      return card;
    }

    function loadScreenshotsAuto(screenshots) {
      const container = document.getElementById('screenshots-container');

      if (!screenshots || !Array.isArray(screenshots) || screenshots.length === 0) {
        container.innerHTML = `<div class="empty-state">Скриншоты отсутствуют</div>`;
        return;
      }

      const fragment = document.createDocumentFragment();
      screenshots.forEach(src => {
        const img = document.createElement('img');
        img.className = 'screenshot-img';
        img.src = src;
        img.loading = "lazy";
        img.onclick = () => openModal(src, 'image');
        fragment.appendChild(img);
      });
      container.replaceChildren(fragment);
    }

    function formatBytes(bytes) {
      if (!bytes || bytes === 0) return 'Файл';
      const k = 1024;
      const sizes = ['Б', 'КБ', 'МБ', 'ГБ'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function parseAndKitResources() {
      const container = document.getElementById('andkit-container');
      container.innerHTML = `<div class="empty-state">Загрузка файлов...</div>`;
      andkitResources = [];

      const imageExts = ['png', 'jpg', 'jpeg', 'webp', 'svg', 'gif'];
      const videoExts = ['mp4', 'webm', 'ogg', 'mov'];
      const audioExts = ['mp3', 'ogg', 'wav', 'm4a'];

      andkitResources = loadedResourcePaths.map(path => {
        const cleanPath = path.replace(/^Resource\//, '');
        const parts = cleanPath.split('/');
        const fileName = parts.pop();
        const folder = parts.join('/');
        const ext = fileName.split('.').pop().toLowerCase();

        let type = 'other';
        if (imageExts.includes(ext)) type = 'image';
        else if (videoExts.includes(ext)) type = 'video';
        else if (audioExts.includes(ext)) type = 'audio';

        return { name: fileName, folder: folder || '', path: path, size: 0, type: type, ext: ext };
      });

      renderAndKit();

      loadedResourcePaths.forEach((path, index) => {
        fetch(path, { method: 'HEAD' }).then(res => {
          if (res.ok) {
            const size = res.headers.get('content-length');
            if (size && andkitResources[index]) {
              andkitResources[index].size = parseInt(size);
              const sizeElem = document.getElementById(`res-size-${index}`);
              if (sizeElem) sizeElem.innerText = formatBytes(andkitResources[index].size);
            }
          }
        }).catch(() => {});
      });
    }

    function setAndKitFilter(filter, btn) {
      currentAndkitFilter = filter;
      document.querySelectorAll('.filter-tags .tag-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderAndKit();
    }

    function filterAndKit() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        renderAndKit();
      }, 100);
    }

    function toggleAudio(src, btn) {
      if (activeAudio && activeAudio.src === new URL(src, window.location.href).href) {
        if (activeAudio.paused) {
          activeAudio.play();
          btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
        } else {
          activeAudio.pause();
          btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        }
        return;
      }

      if (activeAudio) {
        activeAudio.pause();
        document.querySelectorAll('.audio-play-btn').forEach(b => {
          b.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
        });
      }

      activeAudio = new Audio(src);
      activeAudio.play();
      btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;

      activeAudio.onended = () => {
        btn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
      };
    }

    function renderAndKit() {
      const container = document.getElementById('andkit-container');
      const searchVal = document.getElementById('andkit-search').value.toLowerCase();

      const filtered = andkitResources.filter(res => {
        const matchesSearch = res.name.toLowerCase().includes(searchVal) || res.folder.toLowerCase().includes(searchVal);
        const matchesFilter = currentAndkitFilter === 'all' || res.type === currentAndkitFilter;
        return matchesSearch && matchesFilter;
      });

      document.getElementById('res-count-badge').innerText = `${filtered.length} файлов`;

      if (filtered.length === 0) {
        container.innerHTML = `<div class="empty-state">Ресурсы не найдены</div>`;
        return;
      }

      const fragment = document.createDocumentFragment();

      filtered.forEach((res, idx) => {
        const card = document.createElement('div');
        card.className = 'resource-card';

        let previewContent = '';
        if (res.type === 'image') {
          previewContent = `<img src="${res.path}" alt="${res.name}" loading="lazy" onload="this.classList.add('loaded')" onclick="openModal('${res.path}', 'image')">`;
        } else if (res.type === 'video') {
          previewContent = `<video src="${res.path}" preload="metadata" muted playsinline oncanplay="this.classList.add('loaded')" onclick="openModal('${res.path}', 'video')"></video>`;
        } else if (res.type === 'audio') {
          previewContent = `<div class="audio-player-wrapper">
            <button class="audio-play-btn" onclick="toggleAudio('${res.path}', this)">
              <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
            </button>
          </div>`;
        } else {
          previewContent = `<span style="font-size:2rem">📄</span>`;
        }

        const folderBadge = res.folder ? `<div class="folder-badge">${res.folder}</div>` : '';

        card.innerHTML = `
          <div class="resource-preview">
            ${folderBadge}
            ${previewContent}
          </div>
          <div class="resource-name" title="${res.name}">${res.name}</div>
          <div class="resource-meta" id="res-size-${idx}">${formatBytes(res.size)}</div>
          <div class="resource-actions">
            <a class="res-btn" href="${res.path}" download="${res.name}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
              Скачать
            </a>
          </div>`;
        fragment.appendChild(card);
      });

      container.replaceChildren(fragment);
    }

    function renderData(data) {
      if (data.resources && Array.isArray(data.resources)) {
        loadedResourcePaths = data.resources;
      }

      if (data.app_info) {
        document.getElementById('app-icon').src = data.app_info.logo_icon || '';
        document.getElementById('app-title').innerText = data.app_info.title || 'Andbrawl';
        document.getElementById('brand-logo').innerText = data.app_info.title || 'Andbrawl';
        document.getElementById('app-subtitle').innerText = data.app_info.subtitle || '';

        const dlBtn = document.getElementById('download-btn');
        dlBtn.innerText = data.app_info.download_button_text || 'Скачать';
        dlBtn.href = data.app_info.download_url || '#';
      }

      const dropdown = document.getElementById('dropdown');
      const hubContainer = document.getElementById('hub-container');

      let items = [];
      if (data.menu_options && data.menu_options.items) {
        items = [...data.menu_options.items];
      }

      const hasAndKit = items.some(i => i.id === 'andkit' || i.link === '#page-andkit');
      if (!hasAndKit) {
        items.push({
          "id": "andkit",
          "title": "AndKit",
          "description": "Библиотека ресурсов игры, звуки, текстуры и файлы.",
          "icon": "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300f0ff'%3E%3Cpath d='M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm-5 8h-2v2h-2v-2H9v-2h2v-2h2v2h2v2z'/%3E%3C/svg%3E",
          "button_text": "Открыть AndKit",
          "link": "#page-andkit"
        });
      }

      globalHubItems = items;

      const dropdownFrag = document.createDocumentFragment();
      const hubFrag = document.createDocumentFragment();

      items.forEach(item => {
        const isInternal = item.link && item.link.startsWith('#page-');
        const link = document.createElement('a');
        link.className = 'menu-item';

        if (isInternal) {
          const pageId = item.link.replace('#page-', '');
          link.href = '#';
          link.onclick = (e) => {
            e.preventDefault();
            switchPage(pageId);
          };
        } else {
          link.href = item.link;
          if (!item.link.startsWith('#')) {
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
          }
        }

        const iconHtml = (item.icon.startsWith('data:') || item.icon.endsWith('.png') || item.icon.endsWith('.jpg') || item.icon.endsWith('.svg'))
          ? `<img src="${item.icon}" alt="">`
          : `<span class="icon">${item.icon}</span>`;

        link.innerHTML = `${iconHtml} <span>${item.title}</span>`;
        dropdownFrag.appendChild(link);
        hubFrag.appendChild(createCard(item));
      });

      dropdown.replaceChildren(dropdownFrag);
      hubContainer.replaceChildren(hubFrag);

      const quickContainer = document.getElementById('quick-links-container');
      if (data.quick_links && data.quick_links.length > 0) {
        const quickFrag = document.createDocumentFragment();
        data.quick_links.forEach(q => {
          const btn = document.createElement('a');
          btn.className = 'quick-btn';
          btn.href = q.link;
          btn.innerHTML = `<span>${q.icon}</span> <span>${q.title}</span>`;
          quickFrag.appendChild(btn);
        });
        quickContainer.replaceChildren(quickFrag);
      } else {
        quickContainer.innerHTML = `<div class="empty-state">Отсутствует</div>`;
      }

      const creatorsContainer = document.getElementById('creators-container');
      if (data.creators && data.creators.length > 0) {
        const creatorsFrag = document.createDocumentFragment();
        data.creators.forEach(c => {
          const card = document.createElement('a');
          card.className = 'creator-card';
          card.href = c.link;
          card.target = "_blank";
          card.rel = "noopener noreferrer";
          card.innerHTML = `
            <img class="creator-avatar" src="${c.avatar}" alt="" loading="lazy">
            <div class="creator-info">
              <div class="creator-name">${c.name}</div>
              <div class="creator-tag">${c.tag}</div>
            </div>`;
          creatorsFrag.appendChild(card);
        });
        creatorsContainer.replaceChildren(creatorsFrag);
      } else {
        creatorsContainer.innerHTML = `<div class="empty-state">Отсутствует</div>`;
      }

      loadScreenshotsAuto(data.screenshots);
    }

    initTheme();

    fetch('setting.json')
      .then(res => res.json())
      .then(data => renderData(data))
      .catch(err => console.error("Ошибка загрузки setting.json:", err));
  </script>
</body>
</html>
