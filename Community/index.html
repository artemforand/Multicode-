
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Сообщество в разработке</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    width: 100%;
    min-height: 100%;
    -webkit-text-size-adjust: 100%;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background:
        radial-gradient(ellipse at 50% 0%, #252d50 0%, transparent 55%),
        #0b0d13;
    color: #f5f6ff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 440px;
    padding: clamp(26px, 7vw, 42px) clamp(18px, 6vw, 30px);
    text-align: center;
    background: linear-gradient(145deg, #191d2a, #11141d);
    border: 1px solid #2b3043;
    border-radius: clamp(26px, 7vw, 42px);
    box-shadow: 0 24px 80px #0005;
    animation: appear 0.7s ease both;
}

.icon {
    width: clamp(58px, 18vw, 76px);
    aspect-ratio: 1;
    margin: 0 auto 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 1px solid #ffffff20;
    border-radius: 25px;
    background: linear-gradient(145deg, #a5b8ff, #697cf5);
    box-shadow: 0 8px 35px #748aff40;
}

.icon img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 16%;
}

.badge {
    display: inline-block;
    max-width: 100%;
    padding: 8px 13px;
    margin-bottom: 20px;
    border: 1px solid #424b70;
    border-radius: 50px;
    background: #8297ff12;
    color: #a5b8ff;
    font-size: clamp(9px, 2.8vw, 11px);
    font-weight: bold;
    letter-spacing: 1.3px;
    text-transform: uppercase;
}

h1 {
    margin-bottom: 14px;
    font-size: clamp(23px, 7vw, 34px);
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1.25;
    overflow-wrap: anywhere;
}

h1 span {
    color: #a5b8ff;
}

p {
    max-width: 310px;
    margin: 0 auto;
    color: #969daf;
    font-size: clamp(13px, 3.8vw, 15px);
    line-height: 1.8;
}

.line {
    width: min(220px, 80%);
    height: 3px;
    margin: 28px auto 0;
    border-radius: 10px;
    background: linear-gradient(
        90deg,
        transparent,
        #748aff 20%,
        #c1ccff 50%,
        #748aff 80%,
        transparent
    );
    box-shadow:
        0 0 6px #748aff99,
        0 0 16px #748aff4d,
        0 0 30px #748aff1f;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(18px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 360px) {
    .container {
        padding: 28px 18px;
    }
}

@media (max-height: 500px) and (orientation: landscape) {
    body {
        padding: 12px;
    }

    .container {
        margin: auto;
        padding: 22px 18px;
    }

    .icon {
        width: 48px;
        margin-bottom: 12px;
        border-radius: 16px;
    }

    .badge {
        margin-bottom: 12px;
    }

    h1 {
        margin-bottom: 8px;
        font-size: clamp(21px, 5vw, 28px);
    }

    .line {
        margin-top: 16px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .container {
        animation: none;
    }
}
</style>
</head>
<body>
    <main class="container">
        <div class="icon">
            <img src="community.png" alt="Сообщество">
        </div>
        <div class="badge">В разработке</div>
        <h1>Сообщество<br><span>в разработке</span></h1>
        <p>Будет что-то интересное</p>
        <div class="line"></div>
    </main>
</body>
</html>
