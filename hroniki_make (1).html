{id:"intro",title:"Введение: макэ и другие глаза",html:`
<h1>Введение: что такое макэ, Тсукумакэ и другие глаза</h1>
<p class="note">Важно! В этом фэнтези используются термины из аниме «Наруто»: шаринган, томоэ и другие.</p>
<div class="card"><b>Макэ</b><p>Красный глаз, подобный шарингану из «Наруто». Развивается по уровням: от одного до трёх томоэ.</p></div>
<div class="card"><b>Окимико</b><p>Жизненная сила человека. Если она истощается полностью, человек умирает.</p></div>
<div class="card"><b>Тсукумакэ</b><p>Высшая форма макэ. Чтобы получить её, нужно соединить два противоположных глаза, например ангельский и демонический макэ. У каждого макэ своя сила. Тсукумакэ даёт божественное могущество: искривление пространства, мгновенное перемещение, создание существ и материи, власть над Титульялами.</p></div>
<div class="card"><b>Седомакэ</b><p>Слияние макэ двух и более глаз. Это глаз, в котором хранятся другие глаза: один глаз равен одному томоэ, и владелец может управлять любым из них. Он способен создавать из томоэ чёрные шары и возвращать их обратно. Чем больше глаз, тем сильнее Седомакэ, и оно превосходит Омнимакэ, но только если слияний больше пятнадцати.</p></div>
<div class="card"><b>Омнимакэ</b><p>Высшая форма обычного макэ. Чтобы получить её, нужно пережить боль от смерти близкого человека, любовь или сильное счастье. Способности у всех разные.</p></div>
<div class="card"><b>Чикари</b><p>Глаз божественной силы, существующий вместе с макэ. Видит сквозь предметы и на огромные расстояния, не имеет слепой зоны. Может сливаться с макэ и другими глазами, даёт очень высокую скорость движения и позволяет переходить в другое пространство.</p></div>
<div class="card"><b>Акума</b><p>Глаз демонической силы. Позволяет телепортироваться, использовать стихии, создавать щиты и железные доспехи. Может применяться одновременно с макэ и другими глазами.</p></div>
<h2>Как получить макэ</h2>
<div class="card"><p><b>1.</b> Самостоятельно, через боль, как это сделал Ичиро.</p></div>
<div class="card"><p><b>2.</b> По наследству. Дети Ямито и Акио получат гены, благодаря которым макэ первого, второго и третьего уровней пробуждается легче. Но чтобы получить Омнимакэ, им придётся убить, пережить боль, счастье или любовь.</p></div>
<div class="card"><p><b>3.</b> У остальных людей пробуждение макэ ослаблено, и с каждым поколением оно даётся всё труднее. К третьему поколению оно станет невозможным.</p></div>
`},
{id:"ch1",title:"Глава 1. Предыстория возникновения макэ",html:`
<h1>Глава 1. Предыстория возникновения макэ</h1>
<p>Давным-давно, до появления людей, существовали существа, названные Титульялами. Одним из них была Луна, которая сейчас спит. Макэ — это воздействие огромной силы Луны на людей. Если Луна проснётся, она не захочет иметь дело с людьми и заберёт всю силу себе. Не потому, что она враждебна к людям, а потому, что эта сила нужна ей для сохранения равновесия в мире Титульялов.</p>
<p>Есть и другие Титульялы, например Альпо. Все они ненавидят друг друга и живут в космосе на огромных расстояниях друг от друга. Есть Титульялы и в иных измерениях, но большинство измерений созданы затем, чтобы одни Титульялы запечатывали других.</p>
<p>Когда-то Луна запечатала Титульяла по имени Оссо. Тогда она была размером с Солнце и всё равно справилась с трудом: Оссо больше Солнца в шестьдесят четыре раза. Теперь Луна уменьшилась в четыреста раз и ничего не сможет сделать с сильными Титульялами. Оссо же не сидит на месте и понемногу ломает печать. Если он вырвется, миру придёт конец.</p>
<h2>История первого века. «Изначальная причина возникновения силы»</h2>
<p>В древности люди хотели обрести силу, способную править миром. Они заметили, что у страдающих людей пробуждается особая сила, и назвали её макэ. Люди воевали за макэ и постепенно открыли способы его получения. Потом выяснилось, что макэ бывает не только одно и что его можно усиливать. Началось массовое предательство, ведь глаза были почти у всех. Затем люди поняли, что макэ можно довести до совершенно нового уровня, и назвали его Омнимакэ.</p>
<p>Очень редко после смерти обладателей макэ из их тел вырастали деревья, которые срастались друг с другом, а на ветвях созревали яблоки. Однажды человек съел четыре яблока такого дерева. Его глаза стали фиолетовыми, с кругами, и он почти сразу умер от истощения внутренней силы: своего макэ у него не было, и душа не выдержала давления нового глаза. Этот глаз назвали Тсукумакэ.</p>
<p>Люди узнали и другое: можно съедать чужие глаза и красть силу. Человек может и сам передать глаз, но тогда он слепнет. Глаз, в котором собрано много краденых глаз, назвали Седомакэ.</p>
<p>В конце концов люди поняли, что такая сила слишком опасна, и создали три великие страны. Во главе каждой встал правитель с Седомакэ, и они поддерживали мир. Прошло несколько поколений, и о силе забыли. Остались лишь правители, которые продлевали жизнь своим Седомакэ с огромными запасами глаз: у одного из них было больше ста пятидесяти глаз. Ходили легенды, что макэ есть у трёх великих правителей.</p>
<p>Были и люди, получившие другие глаза: белый, названный Чикари, и чёрный, названный Акума. Эти глаза оставались загадкой, потому что пробуждались у тех, кто съедал не все плоды дерева. На дереве вырастает четыре яблока, потому что глаз четыре, но если глаз меньше или больше, то и яблок может быть другое число.</p>
`},
{id:"start",title:"Начало истории: Ичиро и Акихико",html:`
<h1>Начало истории</h1>
<p>В первом году, в деревне Каосаре, жил мужчина по имени Ичиро. Однажды его предала собственная семья, и от этой боли у него пробудился макэ первого уровня. Сначала он не понимал, что с ним происходит, потом осознал: это макэ. Но никто ему не верил. Все решили, что он бредит от горя, ведь его бросила семья. Из-за плохого контроля над макэ Ичиро не мог ничего показать. В конце концов односельчане признали его сумасшедшим и изгнали из деревни. Он и сам начал сомневаться: «Может, это я брежу?»</p>
<p>Затем у него пробудился макэ с двумя томоэ. Ичиро не смог совладать с эмоциями: у него выросли чёрные крылья, тело покрылось чёрными перьями, а из рук вылезли окровавленные мечи. Он пошёл в деревню, сначала убил свою семью, потом всех остальных жителей. От внутренней боли в его макэ пробудилось третье томоэ. Его окутали железный щит и кровавый покров, небо затянуло тучами. Он был в таком гневе, что не владел ни собой, ни своими силами. Ичиро ходил из деревни в деревню, убивал людей, насыщая свой макэ, и рос в размерах.</p>
<p>В шестой деревне, спустя семь дней, выжил один мальчик по имени Акихико. От сильной боли у него пробудился макэ первого уровня. Окружающая энергия вздрогнула, и обезумевший Ичиро бросился за мальчиком. Тогда сработал защитный инстинкт, заложенный в глазах макэ: из глаз Акихико потекла кровь, его окружил синий божественный покров, тучи разошлись, и на Ичиро упала огромная золотая стрела. От страха у Акихико пробудилось второе томоэ.</p>
<p>Акихико подошёл к стреле. Из земли вырвался железный клинок и пронзил его. Мальчик упал. Из земли поднялся поглощённый Ичиро, но от истощения внутренней энергии его макэ вернулся в обычный глаз, покров исчез, и Ичиро упал на землю. Акихико и Ичиро погибли.</p>
<p>Из их тел выросли деревья, которые тянулись друг к другу и образовали великое слияние сил: божественный макэ и дьявольский макэ, две противоположности, слились в Омнимакэ. Дерево получило огромную силу. После слияния оно стало чёрным, а листья на нём стали золотыми.</p>
`},
{id:"brothers",title:"Два брата находят дерево",html:`
<h1>Два брата находят дерево</h1>
<p>Через два года дерево заметно выросло, и на нём появились четыре яблока с красивыми узорами. Мимо проходили двое братьев, Акио и Ямито. Они были голодны. Увидев яблоки, они забрались на дерево, сорвали два плода и пошли дальше. Братья начали есть, и им стало плохо. Акио потерял сознание. Ямито спросил: «Акио, что с тобой?!» — и тоже упал.</p>
<p>Ямито очнулся в холодном поту. Рядом лежал Акио. Ямито не мог себя контролировать: у него неожиданно пробудились Омнимакэ и макэ третьего уровня, не родной, а полученный из яблока. Он пристально посмотрел на брата, и Акио проснулся, закашлялся.</p>
<div class="d">— Ямито?</div>
<div class="d">— Да. Подойди ко мне, — сказал Ямито, не владея собой.</div>
<div class="d">— Что с тобой? Что с твоими глазами?..</div>
<div class="d">— Да так, идём!</div>
<div class="d">— Не подходи ко мне, — отступил Акио.</div>
<p>Ямито побежал к нему. Акио бросился прочь.</p>
<div class="d">— Ты хочешь меня убить? За что?</div>
<div class="d">— Не бойся, я ничего тебе не сделаю.</div>
<p>У Акио тоже пробудились Омнимакэ и макэ третьего уровня. Теперь он чувствовал жизненную силу Ямито и понимал, что тот намерен его убить. Он ощутил, что стал намного сильнее.</p>
<div class="d">— АКИООО, иди ко мне!</div>
<p>Акио остановился, подбежал к Ямито и ударил его в лицо. Ямито упал, но поднялся: его окутала красная аура, тело покрылось чёрным покровом и железными доспехами. Он ударил Акио в ответ. Вокруг Акио вспыхнула синяя аура, за спиной появились белые божественные крылья. Братья сражались. Ямито понял, что умеет телепортироваться, и оказался за спиной Акио. Тот почувствовал его и пронзил насквозь синей аурой.</p>
<p>Ямито телепортировался к дереву и спрятался. Акио понял, что сил почти не осталось, и улетел. Ямито сорвал два последних яблока, и дерево начало гнить. Он съел плоды, закашлялся кровью и ушёл прочь.</p>
`},
{id:"ch2",title:"Глава 2. Десять лет и развитие кланов",html:`
<h1>Глава 2. В течение десяти лет и развитие кланов</h1>
<p>Оба брата странствовали и находили деревни, где останавливались. В четвёртом году Акио пришёл в одну из них и пообещал приносить людям добро своими силами. Он создал техники медицины, гендзюцу и молнии и основал клан Мидзуки. В то же время Ямито подчинил себе жителей своей деревни и стал её лидером. Он учил людей техникам огня, камня, ветра и воды, создавал опасные приёмы, которыми можно убивать и пытать, и основал клан Угачи.</p>
<p>У Ямито появилась жена Кими, а затем дети: дочь Нара и сын Дайки. В двенадцатом году Ямито умер от истощения окимико. Ему было сорок шесть лет. Родного макэ у него не было, поэтому разум мутнел, и души поглощали его. Будь у него родной макэ, он смог бы управлять своими силами. После смерти отца Нара получила особые глаза Акума и макэ первого уровня. Деревней стала руководить её мать.</p>
<p>У Акио тоже появилась семья: жена Юки и сын Хиро. С детства у мальчика был виден глаз Чикари.</p>
<p>В девятнадцатом году Кими умерла от неизлечимой болезни, «заболевания окимико». У Нары пробудился макэ второго уровня. Она была очень расстроена смертью матери, но понимала, что нужно жить дальше, и в свои одиннадцать лет стала главой деревни. Уже понимавший многое Дайки пробудил макэ первого уровня и свои особые глаза Акума.</p>
`},
{id:"masui",title:"Что происходит в деревне Масуи",html:`
<h1>Что происходит в деревне Масуи</h1>
<p>Слуги Такеши и Асами тревожились: Угачи Нара почти ничего не ела с тех пор, как умерла Кими.</p>
<div class="d">— Может, нам нужно что-то сделать? Я боюсь за Нару, — сказала Асами.</div>
<div class="d">— Нужно. Ей сейчас нужна поддержка. Она потеряла мать и отца, да ещё стала главой клана и должна принимать решения, — ответил Такеши.</div>
<p>Они пошли к Наре. Та сидела одна и плакала: «Мама, папа, я так вас люблю. Как мне теперь без вас?» Когда в дверь постучали, она разрешила войти.</p>
<div class="d">— Как вы? — спросили слуги.</div>
<div class="d">— Не знаю… Мне очень плохо. Я не знаю, что делать.</div>
<div class="d">— Все за вас переживают. Вы не ели уже два дня, — сказала Асами.</div>
<div class="d">— Спасибо, но я правда не голодна.</div>
<div class="d">— Простите, но вы слышите, что говорите? Вы можете заболеть. А как же ваш брат Дайки и клан? — не выдержал Такеши.</div>
<div class="d">— Ты прав. У меня есть брат и клан. Я должна в первую очередь думать о них, — тихо сказала Нара.</div>
<div class="d">— Нет, вы должны думать и о себе, — возразила Асами. — Идёмте, я испекла ягодный пирог.</div>
<p>Нара обняла Асами со слезами радости. «Я всегда буду с тобой», — сказала та. Такеши смущённо заметил, что пирог остынет, и Нара впервые засмеялась. Все пошли есть пирог.</p>
<h2>На следующий день</h2>
<p>Нара проснулась с мыслью: в деревне распространяется заболевание окимико, нужно узнать о нём больше. На кухне Асами приготовила рисовую кашу. «Мне её готовила мама…» — вздохнула Нара. Она рассказала, что хочет пойти в библиотеку. Такеши уже с раннего утра ушёл в больницу: болезнью заразились двое человек.</p>
<p>По дороге Нара встретила Такеши. Новостей из больницы не было, всё те же двое больных. В библиотеке её встретил старик Рен.</p>
<div class="d">— Добро пожаловать. Вы что-то ищете?</div>
<div class="d">— Я хочу узнать о заболевании окимико.</div>
<div class="d">— Девочка, а зачем тебе это?</div>
<div class="d">— Я вообще-то Угачи Нара! Мне нужно спасти деревню от этой болезни! — надулась она.</div>
<div class="d">— Может, лучше оставить это взрослым?</div>
<div class="d">— Нет, как глава деревни я должна разобраться сама. А как вас зовут?</div>
<div class="d">— Мне всего семьдесят три, я совсем не старый. Зови меня Рен.</div>
<p>Нара всё равно назвала его стариком, и Рен возмутился, но всё же рассказал: у её отца был брат Акио. Однажды братья разделились, и каждый создал свой клан: отец — Угачи, а Акио — Мидзуки, знаменитый медицинскими техниками. Только они могут помочь и искоренить болезнь.</p>
<p>Нара прибежала домой. Асами вспомнила клан Мидзуки и предложила просить прислать врачей. Такеши тут же написал письмо главе клана и отправился на дипломатическую почту.</p>
<p>По дороге он услышал разговор двух незнакомцев. Они говорили, что болезнь страшная, правителей не стало и на трон села какая-то малолетка, а это позор. Ещё они обсуждали, что Асума и Ицуки хотят создать свой клан и звали в него. «Этот клан вообще может исчезнуть», — сказал один. Такеши сделал вид, что не услышал. Он подумал, что обязательно расскажет обо всём Наре и Асами.</p>
<p>На почте офицер Каори приняла письмо для деревни Миисаги и попросила обновить данные в базе. Такеши записал возраст: Такеши — 28 лет, Асами — 23 года, Нара — 11. Он заметил и другие записи: Рен — 73 года, Кими — 40 лет (мертва, причина: заболевание окимико), Дайки — 9 лет, Каори — 27 лет.</p>
<p>Письмо должны были доставить в течение двух недель. Через две недели Каори постучала в дом и вручила ответ. Такеши закричал на весь дом, что письмо пришло. Все надеялись на хорошие вести, но он прочёл вслух: «Здравствуйте, мы не можем подвергать риску нашу деревню. Отказано».</p>
<p>Улыбки исчезли. «Они отказали нам…» — прошептала Нара. Асами решила, что нужно объявлять карантин, чтобы не заразились другие. Нара расплакалась и убежала в комнату. А Такеши прочёл дальше: болезнь почти неизлечима, и если врачи заразятся, начнётся массовое заболевание окимико и у них.</p>
`},
{id:"war",title:"Месть Нары и война",html:`
<h1>Через четыре года после смерти Кими</h1>
<p>Двое больных из больницы умерли. Но самое страшное случилось потом: заболела и умерла Асами. Нара была подавлена. Она очень любила Асами, как и Такеши. В своём горе она обвинила во всём клан Мидзуки. В те дни у неё пробудился макэ третьего уровня.</p>
<h2>После смерти Асами</h2>
<div class="d">— Я отомщу за подругу. Она была мне как мать. Я изучала свой макэ, и теперь смогу помочь своему народу, — сказала Нара.</div>
<div class="d">— Ты точно этого хочешь? — спросил Дайки.</div>
<div class="d">— Да. Из-за них умерла Асами.</div>
<div class="d">— Делай как знаешь, но я не хочу, чтобы с тобой что-то случилось.</div>
<div class="d">— Ничего не случится. А если случится, ты станешь главой клана Угачи и остановишь войну.</div>
<div class="d">— Береги себя.</div>
<p>Нара начала готовиться к войне. Она спросила Такеши, пойдёт ли он с ней. Он заплакал, но она велела ему собраться, активировала макэ и зло посмотрела на него. Такеши фыркнул и согласился. Людей для настоящей войны не было, поэтому Нара решила идти втроём: она, Такеши и Мисуги. Мисуги оказался сыном старика Рена, ему было двадцать один год. «Если он и правда сын Рена, то это всё меняет», — сказал Такеши.</p>
<p>Через неделю они отправились в Миисаги. Нара объяснила план: ночью проникнуть в деревню и убить старика Акио. Она использует гендзюцу на врагах и убьёт Акио, а своей техникой заберёт его глаза: по её исследованиям, съев их, она получит Тсукумакэ. Если она погибнет, они должны унести её тело, чтобы враги не получили её глаза, и без её команды не вмешиваться. «По моим расчётам, обычным людям пробудить макэ уже нельзя, — добавила она. — Поэтому, если я умру, защитите Дайки». Такеши и Мисуги неловко помолчали и ответили: «Хорошо».</p>
<p>Когда они почти дошли до деревни, Нара велела дождаться ночи. Такеши сказал, что всё это как-то странно, но она оборвала его: «Из-за них умерла Асами. Мы не сдадимся».</p>
<p>Ночью они проникли в деревню. Их заметили, но сами они этого не поняли. Акио ещё не спал и встретил Нару с активированным макэ. Они напали друг на друга. Нара наложила гендзюцу и убила Акио, а затем начала извлекать его глаза техникой Мэндоринсэй. Вдруг в дом ворвалась охрана. Нара наложила гендзюцу на всех, но у неё из глаз пошла кровь. Она выбежала на улицу, где её ждали охрана и Хиро, который своей техникой обездвижил её. «ТАКЕШИ, МИСУГИ!» — закричала Нара. Они выпрыгнули из кустов, подхватили её и бросились бежать. «Я успела забрать глаза, бежим!» — сказала она.</p>
<p>Но в Нару прилетела стрела и пронзила ей сердце. «Что…» — закашлялась она кровью. «НЕЕЕТ, НАРА, живи!» — закричал Такеши. Мисуги обернулся и выпустил из рта гигантский огненный шар в противников. Глаза выпали из рук Нары, и она упала. Нара погибла.</p>
<p>Такеши и Мисуги вернулись в деревню с печальными вестями. Началась война. Через три года Угачи Дайки остановил её, подписав мирный договор между деревнями. Но кланы больше не доверяли друг другу. В те годы у Дайки пробудился макэ второго уровня.</p>
`},
