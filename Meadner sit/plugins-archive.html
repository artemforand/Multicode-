<!DOCTYPE html><html lang="ru"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#0f1411">
<title>Плагины — Meander</title>
<link rel="stylesheet" href="./plugins.css">
<style>
.download-toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px) scale(.96);
  display:flex;
  align-items:center;
  gap:12px;
  min-width:280px;
  max-width:calc(100% - 32px);
  padding:14px 17px;
  border:1px solid rgba(160,216,179,.18);
  border-radius:18px;
  background:rgba(19,28,23,.94);
  box-shadow:0 14px 45px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.03);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  color:#e8eee9;
  opacity:0;
  pointer-events:none;
  z-index:9999;
  transition:opacity .25s ease,transform .25s ease;
}
.download-toast.active{
  opacity:1;
  transform:translate(-50%,0) scale(1);
}
.download-toast-icon{
  width:40px;
  height:40px;
  flex:0 0 40px;
  display:grid;
  place-items:center;
  border-radius:13px;
  background:rgba(160,216,179,.1);
}
.download-toast-icon img{
  width:23px;
  height:23px;
}
.download-toast-content{
  min-width:0;
}
.download-toast-title{
  font-size:14px;
  font-weight:700;
  line-height:1.25;
}
.download-toast-text{
  margin-top:3px;
  color:#aeb9b1;
  font-size:12px;
  line-height:1.3;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
</style>
</head>
<body><header class="topbar">
  <div class="topbar-inner"><div class="brand">
  <div class="brand-icon">
    <img src="artemforand.png" alt="Artemforand">
  </div>
  <div class="brand-text">Meander</div>
</div><div class="top-actions">
  <button class="icon-button" onclick="toggleSort()" aria-label="Сортировка">
    <img src="https://api.iconify.design/solar:sort-vertical-bold-duotone.svg?color=%23e8eee9" alt="">
  </button>  <button class="icon-button" onclick="window.location.href='index.html'" aria-label="Назад">
    <img src="https://api.iconify.design/solar:arrow-left-linear.svg?color=%23e8eee9" alt="">
  </button>
</div>  </div>
</header><main><section class="page active" id="archive">  <div class="hero">
    <div class="hero-main">  <div class="hero-icon">
    <img src="https://api.iconify.design/solar:archive-bold-duotone.svg?color=%23a0d8b3" alt="">
  </div>  <h1>Плагины</h1>
  <p>Готовые расширения для Meander</p></div><div class="hero-count" id="pluginCount">Загрузка...</div>  </div>  <div class="toolbar"><label class="search">
  <img src="https://api.iconify.design/solar:magnifer-linear.svg?color=%23b7c3ba" alt=""><input
id="searchInput"
type="search"
placeholder="Поиск плагинов"
autocomplete="off"

«»

</label><button class="filter-button" onclick="toggleSort()" aria-label="Сортировка">
  <img src="https://api.iconify.design/solar:sort-vertical-bold-duotone.svg?color=%23a0d8b3" alt="">
</button>  </div>  <div class="filters">
    <button class="filter-chip active" data-filter="all">Все</button>
    <button class="filter-chip" data-filter="new">Новые</button>
    <button class="filter-chip" data-filter="updated">Обновлённые</button>
  </div>  <div class="plugins" id="plugins"><div class="empty">
  <div class="empty-icon">
    <img src="https://api.iconify.design/solar:restart-bold-duotone.svg?color=%23a0d8b3" alt="">
  </div>  <div class="empty-title">Загрузка плагинов</div>
  <div class="empty-text">Получение данных из архива</div>
</div>  </div></section><section class="page" id="details">  <div class="details-top"><button class="back-large" onclick="backToArchive()" aria-label="Назад">
  <img src="https://api.iconify.design/solar:arrow-left-linear.svg?color=%23e8eee9" alt="">
</button><span class="details-label">Страница плагина</span>

  </div>  <div class="details-head"><div class="details-icon">
  <img id="detailsIcon" src="" alt="">
</div><div class="details-title">
  <h2 id="detailsName"></h2>
  <p id="detailsAuthor"></p>
</div>  </div>  <div class="details-card"><p class="details-description" id="detailsDescription"></p><div class="details-meta">  <div class="meta">
    <span class="meta-label">Версия</span>
    <span class="meta-value" id="detailsVersion"></span>
  </div>  <div class="meta">
    <span class="meta-label">Обновлено</span>
    <span class="meta-value" id="detailsUpdated"></span>
  </div>  <div class="meta">
    <span class="meta-label">Автор</span>
    <span class="meta-value" id="detailsAuthorMeta"></span>
  </div></div><div class="section-heading">
  <h3>Скриншоты</h3>
  <span id="screenshotCount"></span>
</div><div class="screenshots" id="screenshots"></div><div class="details-actions" id="detailsActions"></div>  </div></section></main><div class="sort-menu" id="sortMenu">  <div class="sort-title">Сортировка</div>  <button class="sort-option" onclick="setSort('default')">
    <img src="https://api.iconify.design/solar:list-linear.svg?color=%23a0d8b3" alt="">
    По умолчанию
  </button>  <button class="sort-option" onclick="setSort('name')">
    <img src="https://api.iconify.design/solar:text-field-focus-linear.svg?color=%23a0d8b3" alt="">
    По названию
  </button>  <button class="sort-option" onclick="setSort('new')">
    <img src="https://api.iconify.design/solar:clock-circle-linear.svg?color=%23a0d8b3" alt="">
    Сначала новые
  </button></div><div class="viewer" id="viewer">  <button class="viewer-close" onclick="closeViewer()" aria-label="Закрыть">
    <img src="https://api.iconify.design/solar:close-circle-bold-duotone.svg?color=%23a0d8b3" alt="">
  </button>  <img id="viewerImage" src="" alt=""></div><div class="download-toast" id="downloadToast">
  <div class="download-toast-icon">
    <img src="https://api.iconify.design/solar:check-circle-bold-duotone.svg?color=%23a0d8b3" alt="">
  </div>
  <div class="download-toast-content">
    <div class="download-toast-title">Скачивание началось</div>
    <div class="download-toast-text" id="downloadToastText">Плагин загружается на устройство</div>
  </div>
</div><script>
let plugins=[];
let currentFilter="all";
let currentSort="default";
let downloadToastTimer=null;

function escapeHTML(value){
  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}

function normalize(value){
  return String(value||"").toLowerCase().trim();
}

function getFilteredPlugins(){
  const query=normalize(document.getElementById("searchInput").value);

  let result=plugins.filter(plugin=>{

    if(currentFilter==="new" && !plugin.new){
      return false;
    }

    if(currentFilter==="updated" && !plugin.updatedRecently){
      return false;
    }

    if(!query){
      return true;
    }

    return [
      plugin.name,
      plugin.description,
      plugin.author,
      plugin.version
    ].some(value=>normalize(value).includes(query));

  });

  if(currentSort==="name"){
    result.sort((a,b)=>
      String(a.name||"").localeCompare(String(b.name||""),"ru")
    );
  }

  if(currentSort==="new"){
    result.sort((a,b)=>
      String(b.updated||"").localeCompare(String(a.updated||""))
    );
  }

  return result;
}

function renderPlugins(){
  const container=document.getElementById("plugins");
  const result=getFilteredPlugins();

  if(!result.length){

    container.innerHTML=`
      <div class="empty">

        <div class="empty-icon">
          <img src="https://api.iconify.design/solar:magnifer-zoom-out-bold-duotone.svg?color=%23a0d8b3" alt="">
        </div>

        <div class="empty-title">Ничего не найдено</div>
        <div class="empty-text">Попробуйте изменить запрос или фильтр</div>

      </div>
    `;

    return;
  }

  container.innerHTML=result.map(plugin=>{

    const index=plugins.indexOf(plugin);

    const name=escapeHTML(plugin.name||"Без названия");
    const description=escapeHTML(plugin.description||"Плагин Meander");
    const version=escapeHTML(plugin.version||"—");
    const updated=escapeHTML(plugin.updated||"—");
    const author=escapeHTML(plugin.author||"Автор не указан");

    const icon=escapeHTML(
      plugin.icon||
      "https://api.iconify.design/solar:code-square-bold-duotone.svg?color=%23a0d8b3"
    );

    return `
      <article class="plugin-card" onclick="openPlugin(${index})">

        <div class="plugin-head">

          <div class="plugin-icon">
            <img src="${icon}" alt="">
          </div>

          <div class="plugin-title">
            <h2>${name}</h2>
            <p>${description}</p>
          </div>

          <div class="plugin-arrow">
            <img src="https://api.iconify.design/solar:arrow-right-up-linear.svg?color=%23a0d8b3" alt="">
          </div>

        </div>

        <div class="plugin-info">

          <div class="chip version">
            <img src="https://api.iconify.design/solar:tag-bold-duotone.svg?color=%23a0d8b3" alt="">
            <span>${version}</span>
          </div>

          <div class="chip">
            <img src="https://api.iconify.design/solar:calendar-bold-duotone.svg?color=%23b7c3ba" alt="">
            <span>${updated}</span>
          </div>

          <div class="chip author">
            <img src="https://api.iconify.design/solar:user-bold-duotone.svg?color=%23b7c3ba" alt="">
            <span>${author}</span>
          </div>

        </div>

      </article>
    `;

  }).join("");
}

function updateCount(){

  const count=document.getElementById("pluginCount");
  const total=plugins.length;

  if(total===0){
    count.textContent="Нет плагинов";
    return;
  }

  const word=
    total%10===1&&total%100!==11
      ?"плагин"
      :total%10>=2&&total%10<=4&&(total%100<10||total%100>=20)
        ?"плагина"
        :"плагинов";

  count.textContent=`${total} ${word}`;
}

function openPlugin(index){

  const plugin=plugins[index];

  if(!plugin){
    return;
  }

  document.getElementById("archive").classList.remove("active");
  document.getElementById("details").classList.add("active");

  const icon=plugin.icon||
    "https://api.iconify.design/solar:code-square-bold-duotone.svg?color=%23a0d8b3";

  document.getElementById("detailsIcon").src=icon;
  document.getElementById("detailsName").textContent=plugin.name||"Без названия";
  document.getElementById("detailsAuthor").textContent=plugin.author||"Автор не указан";
  document.getElementById("detailsDescription").textContent=plugin.description||"";
  document.getElementById("detailsVersion").textContent=plugin.version||"—";
  document.getElementById("detailsUpdated").textContent=plugin.updated||"—";
  document.getElementById("detailsAuthorMeta").textContent=plugin.author||"—";

  const screenshots=document.getElementById("screenshots");

  const images=Array.isArray(plugin.screenshots)
    ?plugin.screenshots
    :[];

  document.getElementById("screenshotCount").textContent=
    images.length
      ?`${images.length} ${images.length===1?"изображение":"изображения"}`
      :"";

  if(images.length){

    screenshots.innerHTML=images.map(src=>`

      <img
        class="screenshot"
        src="${escapeHTML(src)}"
        alt=""
        onclick="event.stopPropagation();openViewer('${escapeHTML(src)}')"
      >

    `).join("");

  }else{

    screenshots.innerHTML=`

      <div class="empty">

        <div class="empty-icon">
          <img src="https://api.iconify.design/solar:gallery-wide-bold-duotone.svg?color=%23a0d8b3" alt="">
        </div>

        <div class="empty-title">Скриншотов нет</div>
        <div class="empty-text">Для этого плагина изображения не добавлены</div>

      </div>

    `;

  }

  const actions=document.getElementById("detailsActions");

  if(plugin.path){

    actions.innerHTML=`

      <a
        class="primary-button"
        href="${escapeHTML(plugin.path)}"
        download
        onclick="showDownloadToast(${index});event.stopPropagation()"
      >

        <img src="https://api.iconify.design/solar:download-bold-duotone.svg?color=%230a3822" alt="">
        Скачать плагин

      </a>

      <button
        class="secondary-button"
        onclick="copyPluginLink(${index})"
        aria-label="Скопировать ссылку"
      >

        <img src="https://api.iconify.design/solar:link-bold-duotone.svg?color=%23a0d8b3" alt="">

      </button>

    `;

  }else{

    actions.innerHTML=`

      <button
        class="primary-button"
        onclick="copyPluginLink(${index})"
      >

        <img src="https://api.iconify.design/solar:link-bold-duotone.svg?color=%230a3822" alt="">
        Поделиться

      </button>

    `;

  }

  history.replaceState(null,"",`#plugin-${index}`);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

function showDownloadToast(index){

  const plugin=plugins[index];
  const toast=document.getElementById("downloadToast");
  const text=document.getElementById("downloadToastText");

  text.textContent=
    plugin&&plugin.name
      ?`${plugin.name} загружается на устройство`
      :"Плагин загружается на устройство";

  toast.classList.add("active");

  clearTimeout(downloadToastTimer);

  downloadToastTimer=setTimeout(()=>{
    toast.classList.remove("active");
  },3500);

}

function backToArchive(){

  document.getElementById("details").classList.remove("active");
  document.getElementById("archive").classList.add("active");

  history.replaceState(null,"",location.pathname);

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}

async function copyPluginLink(index){

  const url=
    location.origin+
    location.pathname+
    `#plugin-${index}`;

  try{

    await navigator.clipboard.writeText(url);

  }catch(error){

    const input=document.createElement("input");

    input.value=url;
    document.body.appendChild(input);
    input.select();
    document.execCommand("copy");
    input.remove();

  }
}

function openViewer(src){

  document.getElementById("viewerImage").src=src;
  document.getElementById("viewer").classList.add("active");

}

function closeViewer(){

  document.getElementById("viewer").classList.remove("active");
  document.getElementById("viewerImage").src="";

}

function toggleSort(){

  document.getElementById("sortMenu").classList.toggle("active");

}

function setSort(type){

  currentSort=type;

  document.getElementById("sortMenu").classList.remove("active");

  renderPlugins();

}

document.getElementById("searchInput").addEventListener(
  "input",
  renderPlugins
);

document.querySelectorAll(".filter-chip").forEach(button=>{

  button.addEventListener("click",()=>{

    document.querySelectorAll(".filter-chip").forEach(item=>{
      item.classList.remove("active");
    });

    button.classList.add("active");

    currentFilter=button.dataset.filter;

    renderPlugins();

  });

});

document.getElementById("viewer").addEventListener("click",function(event){

  if(event.target===this){
    closeViewer();
  }

});

document.addEventListener("click",function(event){

  const menu=document.getElementById("sortMenu");

  const button=event.target.closest(
    ".filter-button,.top-actions .icon-button"
  );

  if(
    menu.classList.contains("active") &&
    !menu.contains(event.target) &&
    !button
  ){

    menu.classList.remove("active");

  }

});

document.addEventListener("keydown",function(event){

  if(event.key==="Escape"){

    closeViewer();

    document.getElementById("sortMenu").classList.remove("active");

    document.getElementById("downloadToast").classList.remove("active");

  }

});

async function loadPlugins(){

  const container=document.getElementById("plugins");

  try{

    const response=await fetch("plugins-archive.txt",{
      cache:"no-store"
    });

    if(!response.ok){
      throw new Error();
    }

    const data=JSON.parse(await response.text());

    plugins=Array.isArray(data)
      ?data
      :data.plugins;

    if(!Array.isArray(plugins)){
      throw new Error();
    }

    updateCount();
    renderPlugins();

    const hash=location.hash;

    if(hash.startsWith("#plugin-")){

      const index=parseInt(
        hash.replace("#plugin-",""),
        10
      );

      if(!Number.isNaN(index)){

        setTimeout(()=>{
          openPlugin(index);
        },0);

      }

    }

  }catch(error){

    document.getElementById("pluginCount").textContent="Ошибка";

    container.innerHTML=`

      <div class="empty">

        <div class="empty-icon">
          <img src="https://api.iconify.design/solar:danger-triangle-bold-duotone.svg?color=%23a0d8b3" alt="">
        </div>

        <div class="empty-title">Не удалось загрузить архив</div>
        <div class="empty-text">Проверьте наличие plugins-archive.txt</div>

      </div>

    `;

  }

}

window.addEventListener("popstate",()=>{

  if(!location.hash.startsWith("#plugin-")){
    backToArchive();
  }

});

loadPlugins();
</script></body></html>
