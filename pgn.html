<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PGN Graphics — Documentation</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-page: #05070f;
            --bg-sidebar: #090d16;
            --bg-header: rgba(9, 13, 22, 0.95);
            --bg-card: rgba(15, 21, 36, 0.6);
            --bg-card-hover: rgba(22, 31, 52, 0.85);
            --bg-code: #060911;
            
            --border: rgba(255, 255, 255, 0.08);
            --border-glow: rgba(99, 102, 241, 0.4);
            
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-muted: #64748b;
            
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --cyan: #38bdf8;
            --cyan-glow: rgba(56, 189, 248, 0.3);
            --emerald: #10b981;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --purple: #a855f7;
            --purple-glow: rgba(168, 85, 247, 0.35);
            
            --sidebar-w: 270px;
            --toc-w: 220px;
            --header-h: 64px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
        }

        html, body {
            overflow-x: hidden;
            background-color: var(--bg-page);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* --- Header --- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: var(--header-h);
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 1100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--primary), var(--purple), var(--cyan));
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 14px;
            color: #fff;
            box-shadow: 0 0 15px var(--primary-glow);
            flex-shrink: 0;
        }

        .brand-title {
            font-weight: 800;
            font-size: 16px;
            letter-spacing: -0.4px;
            background: linear-gradient(135deg, #fff 60%, var(--text-sub));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
        }

        .brand-badge {
            font-size: 10px;
            background: rgba(168, 85, 247, 0.15);
            color: #c084fc;
            border: 1px solid rgba(168, 85, 247, 0.35);
            padding: 2px 8px;
            border-radius: 99px;
            font-weight: 700;
            letter-spacing: 0.5px;
            white-space: nowrap;
        }

        .search-box {
            position: relative;
            width: 220px;
        }

        .search-box input {
            width: 100%;
            background: rgba(15, 21, 36, 0.8);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 8px 12px 8px 34px;
            font-size: 13px;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s;
        }

        .search-box input:focus {
            border-color: var(--purple);
            box-shadow: 0 0 0 3px var(--purple-glow);
        }

        .search-box svg {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 15px;
            height: 15px;
            fill: var(--text-muted);
        }

        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-main);
            cursor: pointer;
            padding: 6px;
            border-radius: 8px;
        }

        .mobile-toggle:active {
            background: rgba(255, 255, 255, 0.1);
        }

        /* --- Overlay for Mobile Sidebar --- */
        .sidebar-overlay {
            position: fixed;
            top: var(--header-h);
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- Layout Structure --- */
        .layout {
            display: flex;
            padding-top: var(--header-h);
            min-height: 100vh;
        }

        /* --- Left Sidebar --- */
        .sidebar {
            width: var(--sidebar-w);
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            position: fixed;
            top: var(--header-h);
            bottom: 0;
            left: 0;
            overflow-y: auto;
            padding: 20px 14px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1000;
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

        .nav-group-title {
            font-size: 11px;
            text-transform: uppercase;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
            padding: 0 8px;
        }

        .nav-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .nav-item a {
            display: flex;
            align-items: center;
            padding: 8px 12px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            border-radius: 8px;
            transition: all 0.15s ease;
        }

        .nav-item a:hover {
            color: var(--text-main);
            background: rgba(255, 255, 255, 0.05);
        }

        /* --- Right TOC Sidebar --- */
        .right-sidebar {
            width: var(--toc-w);
            position: fixed;
            top: calc(var(--header-h) + 24px);
            right: 28px;
            background: var(--bg-sidebar);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            backdrop-filter: blur(12px);
            z-index: 300;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .toc-title {
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--purple);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toc-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .toc-list a {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s;
            display: block;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .toc-list a:hover { color: var(--text-main); }

        /* --- Main Content Area --- */
        .main-container {
            margin-left: var(--sidebar-w);
            margin-right: calc(var(--toc-w) + 40px);
            flex: 1;
            display: flex;
            justify-content: center;
            width: calc(100% - var(--sidebar-w) - var(--toc-w) - 40px);
        }

        .content {
            width: 100%;
            max-width: 920px;
            padding: 32px 40px 90px 40px;
        }

        .doc-hero {
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .doc-breadcrumb {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-weight: 500;
        }

        .doc-title {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 30%, var(--purple) 70%, var(--cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .doc-subtitle {
            font-size: 15px;
            color: var(--text-sub);
            line-height: 1.6;
        }

        /* STICKY CATEGORY PANEL */
        .sticky-category-wrapper {
            position: sticky;
            top: var(--header-h);
            z-index: 800;
            margin: 0 -40px 36px -40px;
            padding: 12px 40px;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .category-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
            padding-top: 2px;
            scrollbar-width: thin;
            scrollbar-color: rgba(168, 85, 247, 0.3) transparent;
        }

        .category-bar::-webkit-scrollbar { height: 4px; }
        .category-bar::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.3);
            border-radius: 4px;
        }

        .cat-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 7px 15px;
            border-radius: 12px;
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text-sub);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            text-decoration: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: pointer;
        }

        .cat-chip:hover, .cat-chip.active {
            color: #fff;
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(99, 102, 241, 0.25));
            border-color: var(--cyan);
            box-shadow: 0 0 16px var(--cyan-glow);
        }

        .cat-chip .chip-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            transition: background 0.2s;
        }

        .cat-chip:hover .chip-dot, .cat-chip.active .chip-dot {
            background: var(--cyan);
            box-shadow: 0 0 8px var(--cyan);
        }

        /* --- Content Blocks --- */
        section {
            margin-bottom: 50px;
            scroll-margin-top: calc(var(--header-h) + 70px);
        }

        h2 {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: var(--text-main);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        h2::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, var(--border), transparent);
        }

        h3 {
            font-size: 16px;
            font-weight: 700;
            color: var(--cyan);
            margin: 20px 0 10px 0;
        }

        p { color: var(--text-sub); font-size: 14px; margin-bottom: 14px; }

        .grid-2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin: 18px 0; }
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 18px 0; }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px;
            backdrop-filter: blur(10px);
            transition: all 0.25s ease;
        }

        .card:hover {
            background: var(--bg-card-hover);
            border-color: var(--border-glow);
            transform: translateY(-2px);
        }

        .callout {
            border-radius: 14px;
            padding: 16px 18px;
            margin: 18px 0;
            font-size: 14px;
            display: flex;
            gap: 14px;
            align-items: flex-start;
            border: 1px solid transparent;
        }

        .callout-icon { flex-shrink: 0; font-size: 18px; line-height: 1; }
        .callout-danger { background: rgba(244, 63, 94, 0.08); border-color: rgba(244, 63, 94, 0.35); color: #ffe4e6; }
        .callout-warning { background: rgba(245, 158, 11, 0.08); border-color: rgba(245, 158, 11, 0.35); color: #fef3c7; }
        .callout-info { background: rgba(56, 189, 248, 0.08); border-color: rgba(56, 189, 248, 0.35); color: #e0f2fe; }
        .callout-title { font-weight: 700; margin-bottom: 4px; font-size: 14.5px; }

        .code-block {
            margin: 16px 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            background: var(--bg-code);
        }

        .code-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 14px;
            background: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'JetBrains Mono', monospace;
        }

        .copy-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text-sub);
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
        }

        pre { padding: 14px; overflow-x: auto; font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6; }

        p code, li code, td code {
            background: rgba(255, 255, 255, 0.08);
            color: #38bdf8;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12.5px;
        }

        .table-container { width: 100%; overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); margin: 18px 0; background: var(--bg-card); }
        table { width: 100%; border-collapse: collapse; font-size: 13.5px; text-align: left; }
        th { background: rgba(15, 21, 36, 0.85); padding: 12px 14px; font-weight: 700; color: var(--text-main); border-bottom: 1px solid var(--border); white-space: nowrap; }
        td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: var(--text-sub); }

        .badge { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 6px; font-size: 10.5px; font-weight: 800; text-transform: uppercase; }
        .badge-global { background: rgba(16, 185, 129, 0.15); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
        .badge-local { background: rgba(56, 189, 248, 0.15); color: var(--cyan); border: 1px solid rgba(56, 189, 248, 0.3); }

        /* --- Mobile Responsiveness --- */
        @media (max-width: 1200px) {
            .right-sidebar { display: none; }
            .main-container { margin-right: 0; width: calc(100% - var(--sidebar-w)); }
        }

        @media (max-width: 992px) {
            .mobile-toggle { display: block; }
            
            .sidebar { 
                transform: translateX(-100%); 
                width: 280px;
                box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            }
            .sidebar.open { transform: translateX(0); }

            .main-container { margin-left: 0; width: 100%; }
            .content { padding: 20px 16px 60px 16px; }
            .sticky-category-wrapper { margin: 0 -16px 24px -16px; padding: 10px 16px; }
        }

        @media (max-width: 600px) {
            .brand-badge { display: none; }
            .brand-title { font-size: 14px; }
            .search-box { width: 140px; }
            .doc-title { font-size: 26px; }
            .doc-subtitle { font-size: 14px; }
        }
    </style>
</head>
<body>

    <header class="header">
        <div style="display: flex; align-items: center; gap: 12px;">
            <button class="mobile-toggle" id="menuToggle" aria-label="Открыть меню">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
            <a href="#" class="header-brand">
                <div class="brand-logo">PGN</div>
                <span class="brand-title">PGN GRAPHICS</span>
                <span class="brand-badge">Developer</span>
            </a>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
            <div class="search-box">
                <svg viewBox="0 0 24 24"><path d="M21.71 20.29l-5.4-5.39A7.9 7.9 0 1 0 15 16.29l5.39 5.4a1 1 0 0 0 1.42-1.42zM10 16a6 6 0 1 1 6-6 6 6 0 0 1-6 6z"/></svg>
                <input type="text" id="docSearch" placeholder="Поиск...">
            </div>
        </div>
    </header>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="layout">
        <nav class="sidebar" id="sidebar"></nav>

        <aside class="right-sidebar">
            <div class="toc-title">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 6h16M4 12h10M4 18h14"/></svg>
                Быстрый переход
            </div>
            <ul class="toc-list" id="tocList"></ul>
        </aside>

        <div class="main-container">
            <main class="content">
                <div class="doc-hero">
                    <div class="doc-breadcrumb">
                        <span>Документация</span>
                        <span>/</span>
                        <span style="color: var(--purple);">PGN Graphics</span>
                    </div>
                    <h1 class="doc-title">PGN Graphics</h1>
                    <p class="doc-subtitle">Официальное руководство пользователя и справочник по языку PGN Graphics.</p>
                </div>

                <!-- Липкая панель с категориями -->
                <div class="sticky-category-wrapper" id="stickyWrapper">
                    <nav class="category-bar" id="categoryBar"></nav>
                </div>

                <!-- Динамический контент -->
                <div id="dynamicContent"></div>
            </main>
        </div>
    </div>

    <script src="pgn-data.js"></script>
    <script>
        async function loadPGNDatabase() {
            try {
                const response = await fetch('pgn-data.json');
                if (response.ok) {
                    const db = await response.json();
                    renderApp(db);
                    return;
                }
            } catch (error) {
                console.warn("Fetch не сработал. Использование window.pgnData:", error);
            }

            if (window.pgnData) {
                renderApp(window.pgnData);
            } else {
                document.getElementById('dynamicContent').innerHTML = `
                    <div class="callout callout-danger">
                        <div class="callout-icon">⚠️</div>
                        <div>
                            <div class="callout-title">Ошибка загрузки данных</div>
                            <div>Не удалось загрузить базу данных документации.</div>
                        </div>
                    </div>
                `;
            }
        }

        function renderApp(db) {
            // 1. Категории
            const categoryBar = document.getElementById('categoryBar');
            categoryBar.innerHTML = db.categories.map(cat => `
                <a href="#${cat.id}" class="cat-chip">
                    <span class="chip-dot"></span>${cat.title}
                </a>
            `).join('');

            // 2. Левое меню
            const sidebar = document.getElementById('sidebar');
            sidebar.innerHTML = db.groups.map(group => `
                <div>
                    <div class="nav-group-title">${group.groupTitle}</div>
                    <ul class="nav-list">
                        ${group.items.map(item => `
                            <li class="nav-item">
                                <a href="#${item.id}" ${item.isHighlight ? 'style="color: var(--purple); font-weight:700;"' : ''}>
                                    ${item.title}
                                </a>
                            </li>
                        `).join('')}
                    </ul>
                </div>
            `).join('');

            // 3. Правое меню
            const tocList = document.getElementById('tocList');
            tocList.innerHTML = db.categories.map(cat => `
                <li><a href="#${cat.id}">• ${cat.title}</a></li>
            `).join('');

            // 4. Секции
            const container = document.getElementById('dynamicContent');
            container.innerHTML = db.sections.map(sec => `
                <section id="${sec.id}">
                    <h2>${sec.title}</h2>
                    ${sec.blocks.map(block => renderBlock(block)).join('')}
                </section>
            `).join('');

            bindEvents();
            setupIntersectionObserver();
        }

        function renderBlock(block) {
            switch (block.type) {
                case 'html':
                    return block.html;
                case 'subTitle':
                    return `<h3>${block.title}</h3>`;
                case 'callout':
                    return `
                        <div class="callout callout-${block.style}">
                            <div class="callout-icon">${block.icon}</div>
                            <div>
                                <div class="callout-title">${block.title}</div>
                                <div>${block.text}</div>
                            </div>
                        </div>
                    `;
                case 'grid2':
                    return `
                        <div class="grid-2">
                            ${block.items.map(card => `
                                <div class="card">
                                    ${card.badge ? `<span class="badge ${card.badge.class}">${card.badge.text}</span>` : ''}
                                    <h3 style="margin-top:8px;">${card.cardTitle}</h3>
                                    ${card.description ? `<p>${card.description}</p>` : ''}
                                    ${card.code ? `
                                        <div class="code-block">
                                            <div class="code-header"><span>${card.codeTitle || 'Код'}</span></div>
                                            <pre><code>${card.code}</code></pre>
                                        </div>
                                    ` : ''}
                                </div>
                            `).join('')}
                        </div>
                    `;
                case 'codeBlock':
                    return `
                        <div class="code-block">
                            <div class="code-header">
                                <span>${block.title}</span>
                                <button class="copy-btn">Скопировать</button>
                            </div>
                            <pre><code>${block.code}</code></pre>
                        </div>
                    `;
                case 'table':
                    return `
                        <div class="table-container">
                            <table>
                                <thead>
                                    <tr>${block.headers.map(h => `<th>${h}</th>`).join('')}</tr>
                                </thead>
                                <tbody>
                                    ${block.rows.map(row => `
                                        <tr>${row.map(cell => `<td>${cell}</td>`).join('')}</tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    `;
                default:
                    return '';
            }
        }

        function bindEvents() {
            // Копирование кода
            document.querySelectorAll('.copy-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const pre = btn.parentElement.nextElementSibling;
                    navigator.clipboard.writeText(pre.innerText).then(() => {
                        const originalText = btn.innerText;
                        btn.innerText = 'Скопировано!';
                        setTimeout(() => { btn.innerText = originalText; }, 2000);
                    });
                });
            });
        }

        function setupIntersectionObserver() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const id = entry.target.getAttribute('id');
                        document.querySelectorAll('.cat-chip').forEach(chip => {
                            chip.classList.toggle('active', chip.getAttribute('href') === `#${id}`);
                        });
                    }
                });
            }, { rootMargin: '-20% 0px -70% 0px' });

            document.querySelectorAll('section[id]').forEach(section => observer.observe(section));
        }

        // --- Мобильная навигация и закрытие по клику вне/на ссылки ---
        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('sidebarOverlay');
        const menuToggle = document.getElementById('menuToggle');

        function toggleSidebar() {
            sidebar.classList.toggle('open');
            overlay.classList.toggle('active');
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
        }

        menuToggle.addEventListener('click', toggleSidebar);
        overlay.addEventListener('click', closeSidebar);

        sidebar.addEventListener('click', (e) => {
            if (e.target.tagName === 'A') {
                closeSidebar();
            }
        });

        // Поиск
        document.getElementById('docSearch').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            document.querySelectorAll('section[id]').forEach(sec => {
                sec.style.display = sec.textContent.toLowerCase().includes(query) ? 'block' : 'none';
            });
        });

        loadPGNDatabase();
    </script>
</body>
</html>
